<div class="home">
  <div class="home__container">

    <!-- HERO -->
    <header class="hero">

      <div class="hero__icon">
        📚
      </div>

      <h1>
        Alyza Reads
      </h1>

      <p>
        Ciao Alyza! 👋<br>
        Sei pronta ad allenarti?
      </p>

    </header>


    <!-- LIVELLI -->
    <section class="levels">

      <!-- LIVELLO 1 -->
      <button
        class="level-card level-card--syllables"
        routerLink="/syllables"
      >

        <div class="level-card__number">
          1
        </div>

        <div class="level-card__content">

          <span class="level-card__icon">
            🔤
          </span>

          <h2>
            Sillabe
          </h2>

          <p>
            Riconosci e leggi le sillabe
          </p>

        </div>

        <span class="level-card__arrow">
          →
        </span>

      </button>


      <!-- LIVELLO 2 -->
      <button
        class="level-card level-card--words"
    routerLink="/words"
      >

        <div class="level-card__number">
          2
        </div>

        <div class="level-card__content">

          <span class="level-card__icon">
            🍎
          </span>

          <h2>
            Parole
          </h2>

          <p>
            Alleniamoci con parole semplici
          </p>

    

        </div>

      </button>


      <!-- LIVELLO 3 -->
      <button
        class="level-card level-card--sentences"
        routerLink="/sentences"
      >

        <div class="level-card__number">
          3
        </div>

        <div class="level-card__content">

          <span class="level-card__icon">
            📖
          </span>

          <h2>
            Frasi
          </h2>

          <p>
            Leggi frasi sempre più lunghe
          </p>

          

        </div>

      </button>

    </section>


    <!-- PROGRESSI -->
    <button
      class="progress-button"
      routerLink="/progress"
    >

      <span class="progress-button__icon">
        🏆
      </span>

      <span class="progress-button__content">

        <strong>
          I miei progressi
        </strong>

        <small>
          Guarda quanto stai migliorando
        </small>

      </span>

      <span class="progress-button__arrow">
        →
      </span>

    </button>

  </div>
</div>
